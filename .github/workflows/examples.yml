name: Examples

on: [push, pull_request]

jobs:
  build-examples:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        board:
          - platform: arduino:avr
            name: uno
            url: http://downloads.arduino.cc/packages/package_index.json
            version: 1.8.8
          - platform: arduino:avr
            name: mega
            url: http://downloads.arduino.cc/packages/package_index.json
            version: 1.8.8
          - platform: arduino:avr
            name: leonardo
            url: http://downloads.arduino.cc/packages/package_index.json
            version: 1.8.8
          - platform: esp32:esp32
            name: esp32doit-devkit-v1
            url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
            version: 3.3.12
          - platform: esp8266:esp8266
            name: d1_mini
            url: https://arduino.esp8266.com/stable/package_esp8266com_index.json
            version: 3.1.2

    steps:
      - uses: actions/checkout@v4
      - name: Install PySerial (needed for ESP32 compilation)
        run: |
          pip3 install --only-binary=:all: pyserial==3.5
      - name: Compile library examples
        uses: arduino/compile-sketches@d7af6619a62e765d91f0a4d65b40cf061537a15d
        with:
          platforms: |
            - name: ${{ matrix.board.platform }}
              source-url: ${{ matrix.board.url }}
              version: ${{ matrix.board.version }}
          fqbn: ${{ matrix.board.platform }}:${{ matrix.board.name }}
          libraries: |
            - name: Servo
              version: 1.3.0
            - name: ESP32Servo
              version: 3.2.1
            - name: Smartcar shield
              source-path: "."
