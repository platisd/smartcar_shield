name: Tests

on: [push, pull_request]

jobs:
  run-unit-tests-and-static-analysis:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        compiler:
          - cc: gcc-12
            cxx: g++-12
          - cc: clang-18
            cxx: clang++-18
    env:
      CC: ${{ matrix.compiler.cc }}
      CXX: ${{ matrix.compiler.cxx }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Shallow clones should be disabled for Sonarqube
      - name: Get dependencies
        run: |
          sudo apt-get install -y ${{ matrix.compiler.cc }}
          sudo apt-get install -y ${{ matrix.compiler.cxx }}
          sudo apt-get install -y lcov cppcheck clang-tidy-18
      - name: Build & run unit tests
        run: bash test/build_and_run_ut.sh
      - name: Run static analysis (cppcheck)
        run: |
          cppcheck --std=c++11 --enable=performance,portability,information --suppress=missingIncludeSystem --suppress=missingInclude --quiet --error-exitcode=1 src/
      - name: Run clang-tidy
        if: matrix.compiler.cc == 'clang-18'
        run: |
          run-clang-tidy-18 \
            -p=test/build \
            -j$(nproc) \
            -header-filter=src/* \
            files src/* \
            -export-fixes clang-tidy-fixes.yaml
      - name: Run clang-tidy-pr-comments action
        uses: platisd/clang-tidy-pr-comments@master
        if: matrix.compiler.cc == 'clang-18'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          clang_tidy_fixes: clang-tidy-fixes.yaml
          request_changes: true
      - name: Get coverage report (only for GCC)
        if: matrix.compiler.cc == 'gcc-12'
        run: |
          bash run_coverage.sh
          bash <(curl -s https://codecov.io/bash) -s coverage-reports || echo "Codecov did not collect coverage reports"
      - name: Generate Sonarqube coverage report (only for GCC)
        if: matrix.compiler.cc == 'gcc-12'
        run: |
          sudo apt-get install -y gcovr
          gcovr --gcov-executable gcov-12 --root . --filter src/ --sonarqube coverage.xml test/build
      - name: Upload Sonarqube inputs (only for GCC)
        if: matrix.compiler.cc == 'gcc-12'
        uses: actions/upload-artifact@v4
        with:
          name: sonarqube-inputs
          path: |
            coverage.xml
            test/build/compile_commands.json
            test/build/googletest-src/googletest/include
            test/build/googletest-src/googlemock/include
          if-no-files-found: error
          retention-days: 1

  sonarqube:
    name: Sonarqube
    needs: run-unit-tests-and-static-analysis
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    env:
      SONAR_SCANNER_VERSION: 8.1.0.6389
      SONAR_SERVER_URL: "https://sonarcloud.io"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download Sonarqube inputs
        uses: actions/download-artifact@v4
        with:
          name: sonarqube-inputs
      - name: Cache SonarCloud packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar
      - name: Download and set up sonar-scanner
        env:
          SONAR_SCANNER_DOWNLOAD_URL: https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-${{ env.SONAR_SCANNER_VERSION }}-linux-x64.zip
        run: |
          mkdir -p $HOME/.sonar
          curl -fsSLo $HOME/.sonar/sonar-scanner.zip ${{ env.SONAR_SCANNER_DOWNLOAD_URL }}
          unzip -o $HOME/.sonar/sonar-scanner.zip -d $HOME/.sonar/
          echo "$HOME/.sonar/sonar-scanner-${{ env.SONAR_SCANNER_VERSION }}-linux-x64/bin" >> $GITHUB_PATH
      - name: Run sonar-scanner
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          sonar-scanner --define sonar.host.url="${{ env.SONAR_SERVER_URL }}"
